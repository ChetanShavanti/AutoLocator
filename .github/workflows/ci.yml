name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run health checks
        run: npm run health

      - name: Job summary
        if: success()
        run: |
          echo "### CI passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Icons validated" >> "$GITHUB_STEP_SUMMARY"
          echo "- TypeScript lint OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unit tests OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production build OK" >> "$GITHUB_STEP_SUMMARY"
